<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Gemini Lernmodus</title>
<link rel="stylesheet" href="ui.css">
</head>
<body class="popup">
  <header>
    <img src="icons/icon32.png" alt="" width="24" height="24">
    <h1>Gemini Lernmodus</h1>
  </header>

  <section id="not-gemini" hidden>
    <p>Öffne <a href="https://gemini.google.com/app" target="_blank">gemini.google.com</a>, um den Lernmodus zu nutzen.</p>
  </section>

  <section id="reload" hidden>
    <p>Die Extension wurde gerade installiert oder aktualisiert. Bitte lade den Gemini-Tab einmal neu.</p>
    <button id="reload-btn" class="secondary">Tab neu laden</button>
  </section>

  <section id="main" hidden>
    <label class="switch-row">
      <span>
        <strong>Lernmodus</strong>
        <small>Text markieren = Textmarker</small>
      </span>
      <input type="checkbox" id="active">
      <span class="switch"></span>
    </label>

    <p class="stats" id="stats"></p>

    <button id="claude" class="primary">✨ An Claude geben</button>
    <small class="stats">Kopiert Chat + Markierungen und öffnet claude.ai – dort Strg+V und abschicken.</small>
    <button id="export" class="secondary">Nur Markierungen exportieren</button>
  </section>

  <footer>
    <a href="#" id="open-options">Einstellungen</a>
    <span>Alt+Shift+L schaltet um</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
